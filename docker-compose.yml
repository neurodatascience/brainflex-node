#
# Fed-BioMed node connected to the researcher through a WireGuard VPN
#
# The researcher and VPN server services are only started with
# `--profile researcher` and `--profile vpnserver`
#
# Adapted from Fed-BioMed (Apache-2.0):
# https://github.com/fedbiomed/fedbiomed/blob/v6.4.1/envs/vpn/docker/docker-compose_run_node.yml
# https://github.com/fedbiomed/fedbiomed/blob/v6.4.1/envs/vpn/docker/docker-compose.yml
#

services:
  #
  # VPN client
  vpn:
    container_name: brainflex-vpn-${FBM_CONTAINER_INSTANCE_ID:-default}
    hostname: brainflex-node-${FBM_CONTAINER_INSTANCE_ID:-default}
    build:
      context: ./docker/vpn
    image: brainflex/vpn-client:${FBM_CONTAINER_VERSION_TAG:-unknown}
    pull_policy: build
    cap_add:
      - net_admin # needed to handle wireguard interface
      - sys_module # needed to remove wireguard kernel module
    devices:
      - /dev/net/tun # needed to handle wireguard interface
    volumes:
      - ./vpn_config:/config # contains VPN configurations
    healthcheck:
      test: ["CMD", "ip", "link", "show", "wg0", "up"]
      interval: 10s
      start_period: 10s
    restart: unless-stopped
  #
  # Fed-BioMed node
  node:
    container_name: brainflex-node-${FBM_CONTAINER_INSTANCE_ID:-default}
    image: fedbiomed/node:${FBM_CONTAINER_VERSION_TAG:-unknown}
    network_mode: service:vpn
    depends_on:
      vpn:
        condition: service_healthy
        restart: true
    # start as root so that the entrypoint can remap the `fedbiomed` user to
    # CONTAINER_UID/CONTAINER_GID, it then drops privileges to `fedbiomed`
    user: root
    environment:
      - CONTAINER_UID
      - CONTAINER_GID
      - FBM_RESEARCHER_IP=${FBM_RESEARCHER_IP:-10.222.0.2}
      - FBM_RESEARCHER_PORT=${FBM_RESEARCHER_PORT:-50051}
      - MNIST_OFF=True
      - FBM_NODE_START_OPTIONS
      - FBM_SECURITY_FORCE_SECURE_AGGREGATION
      - FBM_SECURITY_TRAINING_PLAN_APPROVAL
      - FBM_SECURITY_ALLOW_DEFAULT_TRAINING_PLANS
      - FBM_SECURITY_ALLOW_PREPROC
      - FBM_SECURITY_ALLOW_FEDERATED_ANALYTICS
    volumes:
      - ./fbm-node:/fbm-node # contains fedbiomed component configuration and data
    restart: unless-stopped
  #
  # VPN server
  vpnserver:
    profiles: [vpnserver]
    container_name: brainflex-vpnserver-${FBM_CONTAINER_INSTANCE_ID:-default}
    hostname: brainflex-vpnserver-${FBM_CONTAINER_INSTANCE_ID:-default}
    build:
      context: ./docker/vpnserver
      additional_contexts:
        vpn-client: service:vpn # base image
    image: brainflex/vpn-server:${FBM_CONTAINER_VERSION_TAG:-unknown}
    pull_policy: build
    cap_add:
      - net_admin # needed to handle wireguard interface
      - sys_module # needed to remove wireguard kernel module
    devices:
      - /dev/net/tun # needed to handle wireguard interface
    sysctls:
      - net.ipv4.ip_forward=1 # relay traffic between VPN peers
    volumes:
      - ./vpnserver_config:/config # contains VPN configurations
    ports:
      - 51820:51820/udp # wireguard server
    # separate network: clients on the same docker network cannot reach the
    # server through the host's published port
    networks:
      - vpnserver
    healthcheck:
      test: ["CMD", "ip", "link", "show", "wg0", "up"]
      interval: 10s
      start_period: 10s
    restart: unless-stopped
  #
  # VPN client for the researcher
  researcher-vpn:
    profiles: [researcher]
    container_name: brainflex-researcher-vpn-${FBM_CONTAINER_INSTANCE_ID:-default}
    hostname: brainflex-researcher-${FBM_CONTAINER_INSTANCE_ID:-default}
    image: brainflex/vpn-client:${FBM_CONTAINER_VERSION_TAG:-unknown}
    pull_policy: never # built by the vpn service
    cap_add:
      - net_admin # needed to handle wireguard interface
      - sys_module # needed to remove wireguard kernel module
    devices:
      - /dev/net/tun # needed to handle wireguard interface
    volumes:
      - ./researcher_vpn_config:/config # contains VPN configurations
    # the researcher container uses this container's network
    ports:
      - "${RESEARCHER_HOST:-127.0.0.1}:8888:8888" # jupyter notebook
      - "${RESEARCHER_HOST:-127.0.0.1}:6006:6007" # tensorboard via socat proxy
    healthcheck:
      test: ["CMD", "ip", "link", "show", "wg0", "up"]
      interval: 10s
      start_period: 10s
    restart: unless-stopped
  #
  # Fed-BioMed researcher
  researcher:
    profiles: [researcher]
    container_name: brainflex-researcher-${FBM_CONTAINER_INSTANCE_ID:-default}
    image: fedbiomed/researcher:${FBM_CONTAINER_VERSION_TAG:-unknown}
    network_mode: service:researcher-vpn
    depends_on:
      researcher-vpn:
        condition: service_healthy
        restart: true
    # start as root so that the entrypoint can remap the `fedbiomed` user to
    # CONTAINER_UID/CONTAINER_GID, it then drops privileges to `fedbiomed`
    user: root
    environment:
      - CONTAINER_UID
      - CONTAINER_GID
    volumes:
      - ./fbm-researcher:/fbm-researcher # contains fedbiomed component configuration and data
    restart: unless-stopped

networks:
  vpnserver:
    name: brainflex_vpnserver_${FBM_CONTAINER_INSTANCE_ID:-default}
